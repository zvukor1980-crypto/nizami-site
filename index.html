<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Низами — временно недоступен</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; text-align: center;
      color: #fff6f4;
      background:
        radial-gradient(800px 500px at 20% 0%, rgba(255,110,180,.35), transparent 60%),
        radial-gradient(700px 450px at 90% 20%, rgba(255,224,102,.18), transparent 55%),
        #20141c;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem; padding: 1.6rem 1.4rem;
      border: 3px solid #ff6eb4; border-radius: 24px;
      box-shadow: 0 0 0 4px #2a1020, 6px 8px 0 rgba(255,110,180,.35);
      background: rgba(50, 24, 40, .9);
    }
    h1 { margin: 0 0 .6rem; font-size: 1.6rem; }
    p { margin: 0; color: #f0c4d6; line-height: 1.5; }
    .emoji { font-size: 2.2rem; margin-bottom: .6rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji" aria-hidden="true">🎤💤</div>
    <h1>Сайт временно отключён</h1>
    <p>Низами на паузе. Скоро снова будет громко, блестяще и с пайетками.</p>
  </div>
</body>
</html>
