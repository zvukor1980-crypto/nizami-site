function shell(lines=[]){setMode('shell');screen.innerHTML='<div id="terminal" class="terminal"></div><div class="cmdline"><span id="prompt"></span><input id="inputcmd" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Команда DOS"></div>';let term=$('#terminal');lines.forEach(l=>append(l));$('#prompt').textContent=cwd+'>';let input=$('#inputcmd');input.onkeydown=e=>{if(e.key==='Enter'){let cmd=input.value.trim();append(cwd+'>'+cmd,false);input.value='';if(cmd){history.push(cmd);histpos=history.length;runCommand(cmd)}else input.focus()}else if(e.key==='ArrowUp'){histpos=Math.max(0,histpos-1);input.value=history[histpos]||''}else if(e.key==='ArrowDown'){histpos=Math.min(history.length,histpos+1);input.value=history[histpos]||''}};buttons([['NC',nc],['ИГРЫ',games],['ПЛЕЕР',player],['МЕНЮ',menu],['SETUP',showSettings]]);keys(['\\','..','DIR','CD ','HELP','CLS','EDIT ','DEL ']);function append(l,out=true){let p=document.createElement('div');p.className='line'+(out?' out':'');p.textContent=l;term.appendChild(p);screen.scrollTop=screen.scrollHeight}window.shellOut=append;input.focus()}

function bios(){setMode('bios');screen.innerHTML='<div class="winhead">RETRO BIOS SETUP UTILITY</div><div class="dialog"><p>CPU: PENTIUM 100 MHz [VIRTUAL]</p><p>RAM: 16384 KB [VIRTUAL]</p><p>HDD: C: 540 MB (условный размер)</p><p>FDD: A: 1.44 MB (виртуальный)</p><p>CD-ROM: D: READ ONLY</p><p>VGA: 640 × 480</p><p>Дата: '+new Date().toLocaleString('ru-RU')+'</p><p class="small">BIOS — интерактивная визуализация, не программный BIOS x86.</p></div>';buttons([['ЗАГРУЗКА',shell],['МЕНЮ',menu],['ВЫКЛ.',powerOff]])}
function showSettings(){setMode('settings');screen.innerHTML=`<div class="winhead">НАСТРОЙКИ RETRO PC</div><div class="dialog"><label>Экранная тема<select id="theme"><option value="blue">Classic DOS Blue</option><option value="amber">Amber CRT</option><option value="green">Green Terminal</option></select></label><label><input type="checkbox" id="crt" style="width:auto"/> Эффект CRT</label><p><label><input type="checkbox" id="eco" style="width:auto"/> ECO: меньше анимации</label></p><p><label><input type="checkbox" id="fast" style="width:auto"/> Быстрая загрузка</label></p><hr><button id="backup">Экспорт резервной копии</button><button id="importBtn">Импорт копии</button><input type="file" accept=".json,application/json" id="importFile" hidden><p class="small">Хранилище браузера не гарантировано навсегда. Делайте резервные копии.</p></div>`;$('#theme').value=settings.theme;$('#crt').checked=settings.crt;$('#eco').checked=settings.eco;$('#fast').checked=settings.fast;['theme','crt','eco','fast'].forEach(k=>$('#'+k).onchange=e=>{settings[k]=k==='theme'?e.target.value:e.target.checked;applySettings()});$('#backup').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,fs,settings},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='retro-pc-1995-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.fs||typeof d.fs!=='object'||!d.fs['C:\\'])throw Error('Неверный формат');if(!confirm('Заменить виртуальный диск данными копии?'))return;fs=d.fs;settings={...settings,...d.settings};save();applySettings();showSettings()}catch(e){alert(e.message)}};buttons([['МЕНЮ',menu],['DOS',shell],['ФАЙЛЫ',nc],['ПЕРЕЗАГР.',boot]])}
function player(){setMode('player');screen.innerHTML='<div class="winhead">RETRO MUSIC PLAYER 1.0</div><div class="dialog"><p>Выберите музыку с iPhone. Поддержка форматов зависит от Safari.</p><input id="audioFile" type="file" accept="audio/*" multiple><div id="tracklist"></div><audio id="audio" controls style="width:100%;margin-top:12px"></audio><p class="small">Файлы остаются на устройстве. После закрытия приложения выберите их снова. На странице ничего не передаётся на сервер.</p></div>';let urls=[];$('#audioFile').onchange=e=>{urls.forEach(URL.revokeObjectURL);urls=[...e.target.files].map(URL.createObjectURL);$('#tracklist').innerHTML=[...e.target.files].map((f,i)=>`<button class="pill" data-i="${i}" style="display:block;margin-top:7px;max-width:100%;overflow:hidden">♫ ${esc(f.name)}</button>`).join('');$('#tracklist').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#audio').src=urls[+b.dataset.i];$('#audio').play().catch(()=>{})});if(urls.length){$('#audio').src=urls[0]}};buttons([['МЕНЮ',menu],['DOS',shell],['ФАЙЛЫ',nc]])}
function games(){setMode('games');screen.innerHTML='<div class="winhead">RETRO ARCADE COLLECTION</div><div class="games">'+[['SNAKE 95','Змейка'],['MINES','Сапёр'],['MEMORY','Пары'],['BRICKS','Арканоид'],['SPACE','Космос'],['RACING','Гонки'],['BLOCKS','Падающие блоки']].map(([k,n])=>`<button data-g="${k}">${n}</button>`).join('')+'</div><p class="small">Семь оригинальных мини-игр с сенсорным управлением.</p>';screen.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>launchGame(b.dataset.g));buttons([['DOS',shell],['МЕНЮ',menu],['НАСТРОЙКИ',showSettings]])}
function launchGame(kind){setMode('game');game={kind,score:0,over:false};screen.innerHTML=`<div class="winhead">${esc(kind)} — RETRO ARCADE <span id="score">СЧЁТ: 0</span></div><div id="ginfo" class="small" style="margin-top:8px"></div><div id="gb" class="gameboard"></div><div id="pad" class="pad"></div>`;buttons([['РЕСТАРТ',()=>launchGame(kind)],['ИГРЫ',games],['МЕНЮ',menu]]);if(kind==='SNAKE 95')snake();else if(kind==='MINES')mines();else if(kind==='MEMORY')memory();else if(kind==='BRICKS')arcade('bricks');else if(kind==='SPACE')arcade('space');else if(kind==='RACING')arcade('racing');else blocks()}
function gridBoard(w,h){let gb=$('#gb');gb.style.gridTemplateColumns=`repeat(${w},1fr)`;gb.style.gridTemplateRows=`repeat(${h},1fr)`;gb.innerHTML='<div class="cell"></div>'.repeat(w*h);return [...gb.children]}function addScore(n){game.score+=n;$('#score').textContent='СЧЁТ: '+game.score}function pad(actions){$('#pad').innerHTML=actions.map(([label])=>`<button>${esc(label)}</button>`).join('');[...$('#pad').children].forEach((b,i)=>b.onclick=actions[i][1])}
function snake(){let w=13,h=13,cells=gridBoard(w,h),body=[84,83,82],food=34,dir=1,next=1;$('#ginfo').textContent='Ешьте светлые клетки. Не касайтесь стен и хвоста.';function direction(d){if(d!==-dir)next=d}pad([['←',()=>direction(-1)],['↑',()=>direction(-w)],['↓',()=>direction(w)],['→',()=>direction(1)]]);function draw(){cells.forEach((c,i)=>c.className='cell'+(body.includes(i)?' snake':i===food?' food':''))}draw();gameTimer=setInterval(()=>{dir=next;let head=body[0],n=head+dir;if(n<0||n>=w*h||(dir===1&&head%w===w-1)||(dir===-1&&head%w===0)||body.slice(0,-1).includes(n)){clearInterval(gameTimer);$('#ginfo').textContent='ИГРА ЗАКОНЧЕНА — нажмите РЕСТАРТ';return}body.unshift(n);if(n===food){addScore(10);let free=cells.map((_,i)=>i).filter(i=>!body.includes(i));if(!free.length){clearInterval(gameTimer);$('#ginfo').textContent='ПОБЕДА';return}food=free[Math.floor(Math.random()*free.length)]}else body.pop();draw()},settings.eco?220:150)}
function mines(){let w=9,h=9,mines=new Set;while(mines.size<10)mines.add(Math.floor(Math.random()*81));let shown=new Set,flags=new Set,flagMode=false,cells=gridBoard(w,h);$('#ginfo').textContent='10 мин. Сначала откройте безопасные клетки.';pad([['ОТКРЫТЬ',()=>{flagMode=false;$('#ginfo').textContent='Режим: открыть'}],['ФЛАГ',()=>{flagMode=true;$('#ginfo').textContent='Режим: флаг'}]]);function neighbours(i){let x=i%w,y=Math.floor(i/w),res=[];for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++)if(xx!==x||yy!==y)res.push(yy*w+xx);return res}function draw(){cells.forEach((c,i)=>{c.className='cell'+(!shown.has(i)?flags.has(i)?' flag':' hidden':mines.has(i)?' mine':'');c.textContent=shown.has(i)?mines.has(i)?'✹':String(neighbours(i).filter(n=>mines.has(n)).length||''):flags.has(i)?'⚑':''})}function reveal(i){if(shown.has(i)||flags.has(i))return;shown.add(i);if(mines.has(i)){game.over=true;mines.forEach(x=>shown.add(x));$('#ginfo').textContent='МИНА! Игра закончена.'}else if(neighbours(i).every(n=>!mines.has(n))){neighbours(i).forEach(n=>{if(!shown.has(n))reveal(n)})}if(shown.size===71){game.over=true;$('#ginfo').textContent='ПОБЕДА!';addScore(100)}}cells.forEach((c,i)=>c.onclick=()=>{if(game.over)return;if(flagMode){flags.has(i)?flags.delete(i):flags.add(i)}else reveal(i);draw()});draw()}
function memory(){let values=[...'ABCDEFGH'].flatMap(x=>[x,x]);for(let i=values.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}let cells=gridBoard(4,4),open=[],matched=new Set,locked=false;$('#ginfo').textContent='Найдите восемь одинаковых пар.';cells.forEach((c,i)=>c.onclick=()=>{if(locked||matched.has(i)||open.includes(i))return;open.push(i);draw();if(open.length===2){if(values[open[0]]===values[open[1]]){matched.add(open[0]);matched.add(open[1]);addScore(10);open=[];if(matched.size===16)$('#ginfo').textContent='ПОБЕДА!'}else{locked=true;setTimeout(()=>{open=[];locked=false;if(mode==='game')draw()},750)}}});function draw(){cells.forEach((c,i)=>{c.className='cell'+(!matched.has(i)&&!open.includes(i)?' hidden':'');c.textContent=matched.has(i)||open.includes(i)?values[i]:'?';c.style.fontSize='20px'})}draw()}
function arcade(type){let w=12,h=16,cells=gridBoard(w,h),pos=6,objects=[],tick=0,lives=3;$('#ginfo').textContent=type==='racing'?'Объезжайте машины стрелками.':type==='space'?'Сбивайте врагов нажатием ОГОНЬ.':'Ловите мяч и отбивайте блоки.';pad([['←',()=>pos=Math.max(0,pos-1)],...(type==='space'?[['ОГОНЬ',()=>{let i=objects.findIndex(o=>o.x===pos);if(i>=0){objects.splice(i,1);addScore(10)}}]]:[]),['→',()=>pos=Math.min(w-1,pos+1)]]);function draw(){cells.forEach(c=>{c.className='cell';c.textContent=''});objects.forEach(o=>{let i=o.y*w+o.x;if(cells[i]){cells[i].classList.add('food');cells[i].textContent=type==='racing'?'▣':'◆'}});cells[(h-2)*w+pos].classList.add('snake');cells[(h-2)*w+pos].textContent=type==='racing'?'▲':type==='space'?'♠':'▬'}draw();gameTimer=setInterval(()=>{tick++;if(tick%3===0)objects.push({x:Math.floor(Math.random()*w),y:0});objects.forEach(o=>o.y++);if(objects.some(o=>o.y===h-2&&o.x===pos)){lives--;$('#ginfo').textContent='Жизни: '+lives;if(lives<=0){clearInterval(gameTimer);$('#ginfo').textContent='ИГРА ЗАКОНЧЕНА'}}objects=objects.filter(o=>o.y<h-1);if(type==='bricks'&&tick%6===0)addScore(1);else if(tick%9===0)addScore(1);draw()},settings.eco?250:150)}
function blocks(){let w=10,h=16,cells=gridBoard(w,h),occupied=new Set,pos=4,y=0;$('#ginfo').textContent='Укладывайте падающие блоки. Заполните строку для очков.';pad([['←',()=>{pos=Math.max(0,pos-1);draw()}],['↓',()=>{step()}],['→',()=>{pos=Math.min(w-1,pos+1);draw()}]]);function draw(){cells.forEach((c,i)=>c.className='cell'+(occupied.has(i)?' food':''));let i=y*w+pos;if(cells[i])cells[i].className='cell snake'}function step(){if(y===h-1||occupied.has((y+1)*w+pos)){occupied.add(y*w+pos);for(let row=h-1;row>=0;row--){if(Array.from({length:w},(_,x)=>row*w+x).every(i=>occupied.has(i))){let newSet=new Set;occupied.forEach(i=>{let r=Math.floor(i/w);if(r<row)newSet.add(i+w);else if(r>row)newSet.add(i)});occupied=newSet;addScore(100)}}y=0;pos=4;if(occupied.has(pos)){clearInterval(gameTimer);$('#ginfo').textContent='ИГРА ЗАКОНЧЕНА'}}else y++;draw()}draw();gameTimer=setInterval(step,settings.eco?530:360)}
$('#power').onclick=()=>mode==='off'?boot():confirm('Выключить виртуальный компьютер?')&&powerOff();$('#home').onclick=()=>mode==='off'?boot():menu();setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),15000);$('#clock').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});document.addEventListener('visibilitychange',()=>{if(document.hidden&&gameTimer){clearInterval(gameTimer);gameTimer=null;$('#ginfo')&&($('#ginfo').textContent='ПАУЗА — нажмите РЕСТАРТ')}});powerOff();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
